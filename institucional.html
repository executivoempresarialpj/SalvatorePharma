ra fins informativos e educacionais. Não realiza vendas de medicamentos.</p></section><p id="status" role="status"></p><a href="./admin/">Acesso administrativo</a></main><script>const BASE="https://pxtopfrhmwyfjobuxoac.supabase.co",KEY="sb_publishable_nm3dN40Y2HT45wSf_jUJpw_sCMe9hxA";const headers=(token)=>Object.assign({'apikey':KEY,'Content-Type':'application/json'},token?{Authorization:'Bearer '+token}:{});async function request(path,options={},token){const r=await fetch(BASE+path,{...options,headers:{...headers(token),...options.headers}});const data=await r.json().catch(()=>null);if(!r.ok)throw Error(data?.message||data?.msg||'Falha na comunicação ('+r.status+')');return data;}const endpoint='/rest/v1/salvatore_institutional_content?id=eq.1';let revision=null,busy=false;async function sync(){if(busy)return;busy=true;try{const meta=await request(endpoint+'&select=updated_at',{cache:'no-store'});if(!meta?.[0])throw Error('Conteúdo não encontrado');if(meta[0].updated_at!==revision){const rows=await request(endpoint+'&select=heading,description,logo_image,cover_image,updated_at',{cache:'no-store'});if(!rows?.[0])throw Error('Conteúdo não encontrado');const row=rows[0];for(const k of ['heading','description'])document.getElementById(k).textContent=row[k];for(const [id,k] of [['publicLogo','logo_image'],['publicCover','cover_image']]){const im=document.getElementById(id);im.hidden=!row[k];if(row[k])im.src=row[k];else im.removeAttribute('src');}revision=row.updated_at;}document.getElementById('status').textContent='';}catch(e){document.getElementById('status').textContent='Atualização indisponível; exibindo o último conteúdo carregado.';}finally{busy=false;}}sync();setInterval(()=>{if(!document.hidden)sync()},15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});</script></html>
